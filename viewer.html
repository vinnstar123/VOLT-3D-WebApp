<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="VOLT 3D Viewer">
    <meta name="author" content="Vin Sajith">
    <title>VOLT — 3D Viewer</title>

    <link rel="stylesheet" href="css/bootstrap.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar sticky-top navbar-expand-md navbar_volt">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <div class="logo">
                    <h1>VOLT <span class="bolt">⚡</span></h1>
                    <p class="strapline">Power Up.</p>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="viewer.html">3D Viewer</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="productsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">Products</a>
                        <ul class="dropdown-menu" aria-labelledby="productsDropdown">
                            <li><a class="dropdown-item" href="viewer.html?model=original">VOLT Original</a></li>
                            <li><a class="dropdown-item" href="viewer.html?model=sugarfree">VOLT Sugar Free</a></li>
                            <li><a class="dropdown-item" href="viewer.html?model=bottle">VOLT Original Bottled</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 3D VIEWER -->
    <section id="viewer" class="container my-4">
        <div class="row">
            <div class="col-12">

                <div class="card viewer_card">
                    <div class="card-header viewer_header">
                        <h2 id="modelName">VOLT Original</h2>
                        <p id="modelDescription">Click "Open Can" to release the lightning.</p>
                    </div>

                    <div class="canvas_wrapper">
                        <canvas id="threeContainer"></canvas>
                    </div>

                    <!-- Button Row -->
                    <div class="card-body button_row">
                        <button id="btnPlayAnimation" class="btn btn_volt">Open Can</button>
                        <button id="btnWireframe" class="btn btn_volt">Wireframe</button>
                        <button id="btnRotate" class="btn btn_volt">Rotate</button>
                        <button id="btnSwitchModel" class="btn btn_volt">Next Model</button>
                        <button id="btnLights" class="btn btn_volt">Dim Lights</button>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer_volt">
        <div class="container-fluid">
            <nav class="navbar navbar-expand-sm">
                <p class="copyright">&copy; 2026 VOLT Energy. Student submission, Web 3D Applications (H7006).</p>
                <div class="social ms-auto">
                    <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>

                    <a href="#" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                </div>
            </nav>
        </div>
    </footer>

    <script src="js/bootstrap.bundle.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/106/three.min.js"></script>
    <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/2666677/OrbitControls.js"></script>
    <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/2666677/GLTFLoader.js"></script>

    <script src="script.js"></script>

</body>
</html>
